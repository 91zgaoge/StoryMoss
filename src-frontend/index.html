<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CINEMA-AI | 越写越懂的创作系统</title>
  </head>
  <body class="bg-cinema-950 text-gray-100 antialiased">
    <!-- v5.0.0 修复：加载指示器，防止 React 挂载前被误认为白屏 -->
    <div id="loading-screen" style="position:fixed;inset:0;background:#0c0b09;display:flex;align-items:center;justify-content:center;z-index:99999;">
      <div style="text-align:center;">
        <div style="width:40px;height:40px;border:3px solid #d4af37;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto;"></div>
        <p style="color:#d4af37;margin-top:16px;font-size:14px;">草苔 · 幕后工作室</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // v0.83.8: loading 屏不再只依赖 window load——外部资源挂起时 load 可能永不
      // 触发（真机离线白屏）。React 挂载出第一个节点即隐藏；load + 8s 兜底。
      window.addEventListener('load', () => {
        setTimeout(() => {
          const ls = document.getElementById('loading-screen');
          if (ls) ls.style.display = 'none';
        }, 300);
      });
      (function () {
        const root = document.getElementById('root');
        if (!root) return;
        const hide = () => {
          const ls = document.getElementById('loading-screen');
          if (ls) ls.style.display = 'none';
        };
        const obs = new MutationObserver(() => {
          if (root.childElementCount > 0) {
            hide();
            obs.disconnect();
          }
        });
        obs.observe(root, { childList: true, subtree: false });
        setTimeout(hide, 8000);
      })();
    </script>
  </body>
</html>
